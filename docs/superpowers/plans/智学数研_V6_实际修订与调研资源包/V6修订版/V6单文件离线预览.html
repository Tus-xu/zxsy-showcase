<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智学数研学生端 · V6 设计预览</title>
<style>:root {
  color-scheme: light;
  --brand: #4f46e5;
  --brand-deep: #3730a3;
  --brand-soft: #eef2ff;
  --brand-line: #e0e7ff;
  --ink: #0f172a;
  --text: #273549;
  --muted: #52627a;
  --line: #dbe3ef;
  --line-strong: #c8d3e5;
  --base: #f8fafc;
  --paper: #fff;
  --topbar-height: 60px;
  --sidebar-width: 236px;
  --thread-width: 860px;
  --edge: 21px;
  --radius: 16px;
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--base);
  color: var(--ink);
}

*, *::before, *::after { box-sizing: border-box; }

body { margin: 0; font-size: 14px; line-height: 1.5; }

button, textarea, input { font: inherit; }

button {
  color: inherit;
  cursor: pointer;
}

button:disabled { cursor: default; }

[hidden] { display: none !important; }

:where(button, summary, textarea, input, a, [tabindex]):focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 3px;
}

::selection { color: var(--ink); background: #dfe2ff; }

::placeholder { color: var(--muted); opacity: 1; }

.ambient {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.ambient span { position: absolute; border-radius: 50%; }

.ambient-indigo {
  inset: -80px auto auto -60px;
  width: 420px;
  height: 420px;
  background: rgb(99 102 241 / 10%);
  filter: blur(70px);
}

.ambient-cyan {
  inset: -40px -80px auto auto;
  width: 380px;
  height: 380px;
  background: rgb(6 182 212 / 8%);
  filter: blur(70px);
}

.ambient-violet {
  bottom: -100px;
  left: 30%;
  width: 460px;
  height: 460px;
  background: rgb(124 58 237 / 7%);
  filter: blur(80px);
}

.layout {
  position: relative;
  display: grid;
  grid-template: "topbar topbar" var(--topbar-height) "sidebar workspace" minmax(0, 1fr) / var(--sidebar-width) minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

.topbar {
  grid-area: topbar;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-inline: 20px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}

.brand-mark, .msg-avatar {
  display: grid;
  flex: none;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  color: var(--paper);
  background: var(--brand);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 23px;
  font-weight: 700;
  font-style: italic;
  line-height: 1;
}

.brand-name { font-size: 15px; font-weight: 750; }

.brand-role { color: var(--muted); font-size: 12px; }

.brand-role::before { content: "·"; margin-right: 6px; }

.preview-label {
  flex: none;
  padding: 5px 9px;
  border: 1px solid var(--brand-line);
  border-radius: 7px;
  color: var(--brand-deep);
  background: var(--brand-soft);
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}

.sidebar {
  grid-area: sidebar;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 16px 11px 22px;
  border-right: 1px solid var(--line);
  background: var(--paper);
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

.sidebar-heading {
  margin: 0 9px 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}

.product-nav, #scenes { display: grid; gap: 3px; }

.nav-item, .scenario-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 40px;
  padding: 7px 9px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
  overflow-wrap: anywhere;
}

.nav-item { font-size: 13px; }

.nav-icon { flex: none; width: 23px; text-align: center; }

.nav-item:disabled { color: var(--muted); }

.nav-item:disabled .nav-icon { opacity: .68; filter: saturate(.55); }

.nav-unavailable { margin-left: auto; font-size: 11px; }

.sidebar-sessions { margin-top: 13px; padding-top: 14px; border-top: 1px solid var(--line); }

.scenario-item { min-height: 43px; font-size: 13px; }

.scenario-item > span { min-width: 0; }

.scenario-item > span:only-child { width: 100%; }

:is(.scenario-item, .nav-item):where([aria-current="page"], .is-active, .active) {
  color: var(--brand-deep);
  background: var(--brand-soft);
  font-weight: 680;
}

:is(.scenario-item, .nav-item):enabled:hover { background: var(--brand-soft); }

:is(.scenario-item, .nav-item):focus-visible { outline-offset: -2px; }

.workspace {
  grid-area: workspace;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

.scene-toolbar {
  position: relative;
  z-index: 2;
  min-width: 0;
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 22px;
  padding: 10px clamp(20px, 2.8vw, 40px);
  border-bottom: 1px solid var(--line);
}

.scene-heading { min-width: 0; }

#scene-title {
  margin: 0;
  font-size: 18px;
  font-weight: 750;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

#scene-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

.toolbar-actions { display: flex; align-items: center; gap: 7px; }

.secondary-button, .offline-details summary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  gap: 6px;
  min-height: 34px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.secondary-button:enabled:hover, .offline-details summary:hover {
  border-color: var(--brand-line);
  color: var(--brand-deep);
  background: var(--brand-soft);
}

.offline-details { position: relative; }

.offline-details summary { cursor: pointer; list-style: none; }

.offline-details summary::-webkit-details-marker { display: none; }

.offline-details summary::after {
  content: "";
  width: 6px;
  height: 6px;
  margin: -3px 2px 0 1px;
  border-right: 1px solid currentColor;
  border-bottom: 1px solid currentColor;
  transform: rotate(45deg);
}

.offline-details[open] summary::after { margin-top: 3px; transform: rotate(225deg); }

.offline-description {
  position: absolute;
  top: calc(100% + 8px);
  right: -77px;
  width: min(288px, calc(100vw - 28px));
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  color: var(--text);
  box-shadow: 0 8px 20px rgb(15 23 42 / 7%);
  font-size: 13px;
  line-height: 1.65;
}

.offline-description p { margin: 0; }

.scroll-area, .composer-area {
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
  scrollbar-gutter: stable both-edges;
}

.scroll-area {
  min-width: 0;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 24px var(--edge) 26px;
  scroll-padding: 18px;
}

.scroll-area:focus-visible { outline-offset: -3px; }

.thread, .composer-inner {
  width: min(100%, var(--thread-width));
  margin-inline: auto;
}

.thread { display: grid; gap: 24px; }

.msg { min-width: 0; display: flex; align-items: flex-start; gap: 10px; }

.msg-main { min-width: 0; }

.msg--assistant .msg-main { flex: 1; }

.msg--student { flex-direction: row-reverse; }
.msg--student .user-bubble { max-width: min(84%, 660px); }

.msg--student .msg-main { max-width: min(84%, 660px); }

.msg--student .msg-avatar {
  color: var(--brand-deep);
  background: var(--brand-soft);
  font-family: inherit;
  font-size: 13px;
  font-style: normal;
}

.msg-author { margin: 3px 0 7px; font-size: 12px; font-weight: 700; line-height: 1.5; }

.msg--student .msg-author { text-align: right; color: var(--muted); }

.reply-panel, .user-bubble {
  min-width: 0;
  overflow-wrap: anywhere;
}

.reply-panel {
  padding: 18px clamp(15px, 2.25vw, 27px) 19px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.75;
}

.user-bubble {
  padding: 10px 14px;
  border: 1px solid var(--brand-line);
  border-radius: 15px 15px 5px 15px;
  background: var(--brand-soft);
  font-size: 14px;
  line-height: 1.65;
}

.user-bubble p { margin: 0; }

.user-bubble p + p { margin-top: 7px; }

.reply-panel :where(p, ul, ol) { margin-block: 0 10px; }

.reply-panel :where(ul, ol) { padding-inline-start: 1.45em; }

.reply-panel li + li { margin-top: 4px; }

.reply-panel :where(h2, h3, h4) {
  margin: 17px 0 6px;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
  font-weight: 750;
}

.reply-panel :where(h2, h3, h4):first-child { margin-top: 0; }

.reply-panel > :last-child, .response-block > :last-child { margin-bottom: 0; }

.response-block + .response-block { margin-block-start: 15px; }

.math-display, .table-wrap { max-width: 100%; overflow-x: auto; scrollbar-width: thin; }

.math-display { margin: 10px 0 13px; text-align: center; }

.math-display .katex-display { margin: .45em 0; }

.reply-panel .katex { font-size: 1.1em; }

.figure-widget {
  min-width: 0;
  margin-block: 15px;
  padding-block: 13px 10px;
  border-block: 1px solid var(--line);
}

.figure-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 10px; }

.figure-widget .figure-heading { margin-top: 0; }

.figure-widget :is(svg, canvas, img) { display: block; max-width: 100%; height: auto; }
.figure-widget .figure-canvas { width: 100%; height: clamp(190px, 23vw, 248px); }
.figure-legend { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 12px; }
.figure-legend span { display: inline-flex; align-items: center; gap: 5px; }
.figure-legend span::before { content: ""; inline-size: 14px; block-size: 0; border-top: 2px solid #4338ca; }
.figure-legend .legend-line::before { border-top: 2px dashed #0e7490; }
.figure-controls label { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; width: 100%; }
.problem-block { margin-block: 10px; padding: 12px 14px; border-radius: 10px; background: #f6f7fc; }
.problem-block p { margin: 4px 0 0; }
.math-display { overflow-x: auto; }
.photo-full { display: block; max-width: 100%; height: auto; }
.v5-announcement { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); }

.figure-readout {
  margin-block: 7px;
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.figure-controls {
  display: grid;
  gap: 6px;
  margin-block: 8px 4px;
  color: var(--text);
  font-size: 13px;
}

.figure-controls label { overflow-wrap: anywhere; }

.figure-controls input[type="range"] {
  display: block;
  width: 100%;
  min-height: 29px;
  margin: 0;
  accent-color: var(--brand);
  cursor: pointer;
}

.figure-presets, .action-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-block: 12px 0;
}

.action, .figure-presets button, .source-button {
  min-height: 36px;
  max-width: 100%;
  padding: 6px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--paper);
  color: var(--text);
  text-align: left;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.action:enabled:hover, .figure-presets button:enabled:hover, .source-button:enabled:hover,
:is(.action, .figure-presets button)[aria-pressed="true"] {
  border-color: #a7adfd;
  background: var(--brand-soft);
  color: var(--brand-deep);
}

.action--answer { min-width: 43px; }

.action--primary {
  border-color: var(--brand);
  background: var(--brand);
  color: var(--paper);
}

.action--primary:enabled:hover { border-color: var(--brand-deep); background: var(--brand-deep); color: var(--paper); }

.action:disabled { border-color: var(--line); background: var(--base); color: var(--muted); }

.inline-state, .note, .review-record {
  margin-block: 11px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--base);
  color: var(--text);
  font-size: 13px;
  line-height: 1.6;
}

.note-label { margin-inline-end: 5px; color: var(--brand-deep); font-weight: 700; }

.inline-state p:last-child, .note p:last-child, .review-record p:last-child { margin: 0; }

.table-wrap { margin-block: 10px; }

.data-table {
  width: 100%;
  border-collapse: collapse;
  color: var(--text);
  text-align: left;
  font-size: 13px;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
}

.data-table :is(th, td) { padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }

.data-table th { background: var(--base); font-weight: 680; }

.data-table caption { margin-bottom: 5px; color: var(--muted); text-align: left; }

.source-button { border-color: var(--brand-line); color: var(--brand-deep); font-size: 12px; }

.photo-button {
  display: block;
  width: fit-content;
  max-width: 100%;
  margin-block: 9px 1px;
  padding: 4px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--paper);
  color: var(--brand-deep);
  font-size: 12px;
}

.photo-button:enabled:hover { border-color: var(--brand); }

.photo-button img { display: block; max-width: min(100%, 275px); max-height: 170px; object-fit: contain; border-radius: 5px; }

.attachment-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  max-width: 100%;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--text);
  background: var(--base);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.attachment-chip img { width: 29px; height: 29px; object-fit: cover; border-radius: 4px; }

.attachment-chip button {
  flex: none;
  min-width: 30px;
  min-height: 30px;
  padding: 2px 5px;
  border: 0;
  border-radius: 5px;
  color: var(--brand-deep);
  background: transparent;
}

.attachment-chip button:hover { background: var(--brand-soft); }

.composer-area {
  overflow: hidden;
  padding: 10px var(--edge) max(13px, env(safe-area-inset-bottom));
  border-top: 1px solid rgb(219 227 239 / 64%);
  background: transparent;
}

.composer-inner { display: grid; gap: 7px; }

.jump-button { justify-self: center; min-height: 31px; color: var(--brand-deep); }

.composer-notice { margin: 0; padding-inline: 3px; color: var(--text); font-size: 13px; overflow-wrap: anywhere; }

.composer {
  display: grid;
  min-width: 0;
  gap: 4px;
  padding: 9px 12px 8px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: 0 1px 3px rgb(15 23 42 / 5%);
}

.composer:focus-within { border-color: #a7adfd; }

.composer textarea {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 45px;
  max-height: 138px;
  padding: 5px 3px;
  border: 0;
  border-radius: 3px;
  color: var(--ink);
  background: transparent;
  caret-color: var(--brand);
  resize: vertical;
  line-height: 1.5;
}

.composer textarea:focus-visible { outline-offset: 0; }

.draft-attachment { min-width: 0; margin-bottom: 3px; }

.composer-actions {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
}

.composer-keyboard { justify-self: end; color: var(--muted); font-size: 11px; }

.icon-button, .send-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 35px;
  min-height: 35px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 13px;
}

.icon-button { background: transparent; color: var(--text); }

.icon-button:enabled:hover { color: var(--brand-deep); background: var(--brand-soft); }

.send-button { min-width: 65px; background: var(--brand); color: var(--paper); font-weight: 650; }

.send-button:enabled:hover { background: var(--brand-deep); }

.send-button:disabled { border-color: var(--line); background: #f2f5fa; color: var(--muted); }

.clip-icon {
  position: relative;
  width: 9px;
  height: 16px;
  border: 1.3px solid currentColor;
  border-radius: 5px;
  transform: rotate(38deg);
}

.clip-icon::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 1px;
  width: 4px;
  height: 9px;
  border: 1.3px solid currentColor;
  border-top: 0;
  border-radius: 0 0 4px 4px;
}

.sidebar-toggle { display: none; }

.menu-icon {
  width: 17px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
  box-shadow: 0 -5px currentColor, 0 5px currentColor;
}

.sidebar-toggle[aria-expanded="true"] { color: var(--brand-deep); background: var(--brand-soft); }

dialog {
  width: min(640px, calc(100% - 30px));
  max-height: calc(100dvh - 30px);
  padding: 0;
  overflow: auto;
  border: 0;
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: 0 14px 48px rgb(15 23 42 / 18%);
  color: var(--ink);
}

dialog::backdrop { background: rgb(15 23 42 / 36%); }

.dialog-inner { padding: 18px; font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }

.dialog-inner :where(h2, h3) { margin-block: 0 8px; font-size: 18px; }

.dialog-inner img { display: block; max-width: 100%; max-height: 69vh; margin-inline: auto; object-fit: contain; }

.dialog-close {
  min-width: 35px;
  min-height: 35px;
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--brand-deep);
  background: var(--paper);
  font-size: 13px;
}

.dialog-close:hover { background: var(--brand-soft); }

.empty { margin-block: 25px; color: var(--muted); text-align: center; }

.muted { color: var(--muted); }

@media (max-width: 690px) {
  .layout {
    grid-template: "topbar" var(--topbar-height) "workspace" minmax(0, 1fr) / minmax(0, 1fr);
  }

  .topbar { padding-inline: 12px; }

  .sidebar-toggle { display: inline-flex; }

  .sidebar {
    grid-area: auto;
    position: absolute;
    z-index: 3;
    inset: var(--topbar-height) auto 0 0;
    width: min(var(--sidebar-width), calc(100% - 28px));
    visibility: hidden;
    transform: translateX(-100%);
    box-shadow: 8px 0 23px rgb(15 23 42 / 9%);
    transition: transform 160ms ease-out, visibility 160ms;
  }

  body.sidebar-open .sidebar { visibility: visible; transform: none; }

  .scene-toolbar { padding-inline: 17px; }

  :root { --edge: 15px; }
}

@media (max-width: 480px) {
  :root { --edge: 12px; }

  .topbar { gap: 6px; padding-inline: 9px 12px; }

  .topbar-brand { gap: 7px; }

  .brand-mark { width: 28px; height: 28px; border-radius: 8px; font-size: 21px; }

  .brand-role::before { display: none; }

  .preview-label { padding-inline: 6px; }

  .scene-toolbar { display: grid; gap: 7px; min-height: 0; padding-block: 8px; padding-inline: 15px; }

  #scene-title { font-size: 16px; }

  .toolbar-actions { min-height: 35px; }

  .offline-description { right: auto; left: 0; }

  .scroll-area { padding-block: 15px 18px; }

  .thread { gap: 18px; }

  .msg { gap: 6px; }

  .msg-avatar { width: 25px; height: 25px; border-radius: 7px; font-size: 18px; }

  .msg--student .msg-main { max-width: 88%; }

  .reply-panel { padding: 12px; }

  .user-bubble { padding: 8px 10px; }

  .action, .figure-presets button, .source-button { min-height: 40px; }

  .composer { gap: 2px; padding: 6px 8px; }

  .composer-keyboard { display: none; }

  .composer textarea { font-size: 16px; }

  #send { grid-column: 3; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
/* V6: semantic surface system; V5 base contracts retained. */
:root{--brand:#5542cf;--brand-deep:#4734b3;--brand-soft:#eeebff;--brand-line:#e2ddfa;--ink:#222238;--text:#34384a;--muted:#70778c;--line:#e5e6ef;--line-strong:#d7d9e5;--base:#f7f7fb;--thread-width:940px;--sidebar-width:238px;--topbar-height:58px;--edge:24px;--radius:15px}

<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient-indigo"></span>
    <span class="ambient-cyan"></span>
    <span class="ambient-violet"></span>
  </div>

  <div class="layout">
    <header class="topbar">
      <div class="topbar-brand">
        <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="示例和学习导航" aria-controls="sidebar" aria-expanded="false">
          <span class="menu-icon" aria-hidden="true"></span>
        </button>
        <span class="brand-mark" aria-hidden="true">π</span>
        <span class="brand-name">智学数研</span>
        <span class="brand-role">学生端</span>
      </div>
      <span class="preview-label">离线 · V6</span>
    </header>

    <aside id="sidebar" class="sidebar" aria-label="学生端侧栏">
      <h2 class="sidebar-heading" id="learning-nav-heading">学习导航</h2>
      <nav class="product-nav" aria-labelledby="learning-nav-heading">
        <button type="button" class="nav-item" data-product-nav="home" aria-current="page"><span class="nav-icon" aria-hidden="true">🏠</span>首页</button>
        <button type="button" class="nav-item" data-product-nav="practice"><span class="nav-icon" aria-hidden="true">✏️</span>练题</button>
        <button type="button" class="nav-item" data-product-nav="error"><span class="nav-icon" aria-hidden="true">📕</span>错题</button>
        <button type="button" class="nav-item" disabled><span class="nav-icon" aria-hidden="true">📚</span>知识库<span class="nav-unavailable">未开放</span></button>
        <button type="button" class="nav-item" disabled><span class="nav-icon" aria-hidden="true">📺</span>资源中心<span class="nav-unavailable">未开放</span></button>
        <button type="button" class="nav-item" disabled><span class="nav-icon" aria-hidden="true">🎓</span>课堂<span class="nav-unavailable">未开放</span></button>
        <button type="button" class="nav-item" disabled><span class="nav-icon" aria-hidden="true">👤</span>我的<span class="nav-unavailable">未开放</span></button>
      </nav>
      <div class="sidebar-sessions">
        <h2 class="sidebar-heading" id="scenes-heading">学习会话</h2>
        <nav id="scenes" aria-labelledby="scenes-heading"></nav>
      </div>
    </aside>

    <main class="workspace" aria-labelledby="scene-title">
      <header class="scene-toolbar">
        <div class="scene-heading">
          <h1 id="scene-title">学生端 AI 回答</h1>
          <p id="scene-subtitle" hidden></p>
        </div>
        <div class="toolbar-actions">
          <details class="offline-details">
            <summary>离线体验</summary>
            <div class="offline-description">
              <p>在侧栏切换示例会话，可以作答、追问和操作图形。输入框支持示例中提供的提问，选中的图片留在本机。</p>
            </div>
          </details>
          <button id="restart" class="secondary-button" type="button">重置会话</button>
        </div>
      </header>

      <section id="scroll" class="scroll-area" tabindex="0" aria-label="对话内容">
        <div id="thread" class="thread">
          <noscript><p class="empty">请开启浏览器的 JavaScript 来体验示例会话。</p></noscript>
        </div>
      </section>

      <footer class="composer-area">
        <div class="composer-inner">
          <button id="jump" class="secondary-button jump-button" type="button" hidden><span aria-hidden="true">↓</span> 回到最新</button>
          <p id="notice" class="composer-notice" aria-live="polite" hidden></p>
          <form id="composer" class="composer">
            <div id="draft-attachment" class="draft-attachment" hidden></div>
            <textarea id="draft" rows="2" aria-label="输入你的问题" placeholder="写下你的问题，或添加题图"></textarea>
            <div class="composer-actions">
              <button id="attach" class="icon-button attach-button" type="button" aria-label="添加题图" title="添加题图">
                <span class="clip-icon" aria-hidden="true"></span>
              </button>
              <input id="file" type="file" accept="image/*" hidden>
              <span class="composer-keyboard">Enter 发送 · Shift+Enter 换行</span>
              <button id="send" class="send-button" type="submit" disabled><span aria-hidden="true">↑</span> 发送</button>
            </div>
          </form>
        </div>
      </footer>
    </main>
  </div>

  <dialog id="source-dialog" aria-label="讲义来源"></dialog>
  <dialog id="photo-dialog" aria-label="题图预览"></dialog>

果你想知道为什么代一个测试点就能判断整个区间，下面可以展开完整推导。"}], "actions": [{"kind": "view", "label": "展开完整解析", "to": "photo-solution"}, {"kind": "link", "label": "按我的答案引导", "scene": "guide"}], "inputs": [{"aliases": ["直接讲解", "看解析", "为什么是2", "为什么是 C"], "to": "photo-solution"}, {"aliases": ["局部是什么意思", "最低点是什么意思"], "to": "photo-clarify"}]}, "photo-solution": {"blocks": [{"type": "p", "text": "这里把判断依据写完整，方便你以后在考试中直接复用。"}, {"type": "heading", "text": "1. 用导数符号确定单调性"}, {"type": "math", "latex": "g'(-2)=24,\\quad g'(0)=-12,\\quad g'(3)=24"}, {"type": "p", "text": "在每一个区间里，\\(x+1\\) 与 \\(x-2\\) 的符号各自固定，所以一个测试点足以代表整个区间。"}, {"type": "visual", "kind": "sign-g"}, {"type": "heading", "text": "2. 区分极值点与极值"}, {"type": "math", "latex": "\\begin{aligned}g(-1)&=8\\quad (\\text{局部极大值})\\\\g(2)&=-19\\quad (\\text{局部极小值})\\end{aligned}"}, {"type": "note", "label": "最后结论", "text": "选 C，即 \\(x=2\\)。若题目改问极小值是多少，才写 \\(-19\\)。"}, {"type": "p", "text": "这道题没有实数域上的全局最小值。局部谷底和整条曲线最低处不是一个概念。"}], "actions": [{"kind": "link", "label": "试着独立判断", "scene": "guide"}, {"kind": "view", "label": "“局部”具体是什么意思？", "to": "photo-clarify"}], "inputs": [{"aliases": ["局部是什么意思", "它是最低点吗", "为什么不能说是全局最低"], "to": "photo-clarify"}], "terminal": true}, "photo-clarify": {"blocks": [{"type": "p", "text": "把 \\(x=2\\) 左右想成一小截曲线。只要附近的点都比 \\(g(2)\\) 高，这一小截上它就是谷底。问全局最小值，要比较整个定义域。这个三次函数在 \\(x\\to-\\infty\\) 时趋向 \\(-\\infty\\)，所以它在实数域没有全局最小值。"}], "actions": [{"kind": "link", "label": "看图验证走势", "scene": "graph"}], "inputs": [], "terminal": true}, "photo-upload": {"blocks": [{"type": "p", "text": "这道三次函数题问的是取得局部极小值时的横坐标。题面对应 \\(g(x)=2x^3-3x^2-12x+1\\)。先求导，找出曲线上可能成为峰顶或谷底的点。"}, {"type": "math", "latex": "g'(x)=6(x+1)(x-2),\\qquad x=-1\\ \\text{或}\\ x=2"}, {"type": "p", "text": "接下来只用比较这两个点附近的走势。想先自己选，可以转到作答。"}], "actions": [{"kind": "view", "label": "展开完整解析", "to": "photo-solution"}, {"kind": "link", "label": "自己选一次", "scene": "guide"}], "inputs": [{"aliases": ["直接讲解", "看解析", "为什么是2"], "to": "photo-solution"}, {"aliases": ["局部是什么意思"], "to": "photo-clarify"}]}, "confirm-image": {"blocks": [{"type": "p", "text": "请确认最后的常数项。预设样本里这道题是 \\(g(x)=2x^3-3x^2-12x+1\\)。题图截断时，先把题面核对好，再继续讲解。"}], "actions": [{"kind": "view", "label": "确认是 +1", "to": "photo-upload"}], "inputs": [{"aliases": ["+1", "末尾是加1", "确认是+1"], "to": "photo-upload"}]}}}, {"id": "guide", "label": "引导与订正", "title": "候选点里，谁才是极小点？", "subtitle": "同一题 · 依据你的作答解释", "seed": {"text": "我能把导数算出来，但一出现两个零点，我就不知道选哪个。"}, "start": "guide-open", "nodes": {"guide-open": {"blocks": [{"type": "p", "text": "那我们跳过求导的流水账。导数为零只把位置圈小了。做一次你的判断，我用你选的那个点来讲。"}, {"type": "problem", "id": "g"}], "actions": [{"kind": "answer", "label": "A · −1", "to": "zero", "value": "A", "record": {"problem": "g", "value": "A", "correct": false}}, {"kind": "answer", "label": "B · 1", "to": "not-one", "value": "B", "record": {"problem": "g", "value": "B", "correct": false}}, {"kind": "answer", "label": "C · 2", "to": "correct", "value": "C", "record": {"problem": "g", "value": "C", "correct": true}}, {"kind": "answer", "label": "D · −2", "to": "not-minus-two", "value": "D", "record": {"problem": "g", "value": "D", "correct": false}}], "inputs": [{"aliases": ["A", "选A", "-1", "我选-1", "x=-1", "x=-1处是极小值"], "to": "zero", "record": {"problem": "g", "value": "A", "correct": false}}, {"aliases": ["B", "选B", "1", "x=1", "我选1"], "to": "not-one", "record": {"problem": "g", "value": "B", "correct": false}}, {"aliases": ["C", "选C", "2", "x=2", "我选2", "我改选C", "2是极小值点"], "to": "correct", "record": {"problem": "g", "value": "C", "correct": true}}, {"aliases": ["D", "选D", "-2", "x=-2"], "to": "not-minus-two", "record": {"problem": "g", "value": "D", "correct": false}}, {"aliases": ["为什么不是最低点", "我想用函数值比较", "局部是什么意思"], "to": "need-values"}, {"aliases": ["g(0)>0所以这里在上升", "函数值为正所以在上升", "函数值为正不就是在上升吗"], "to": "height"}, {"aliases": ["导数等于零所以是极小", "导数等于0就是极小吗"], "to": "criterion"}, {"aliases": ["g(0)为正", "g(0)=1"], "to": "height-check"}, {"aliases": ["想看符号表", "给我符号表", "我想看完整推导"], "to": "switch-sign"}, {"aliases": ["我没思路", "给个   const data = window.V5_DATA

  }

  let fileSequence = 0

  function persist() {

      return true
    } catch {
      storageAvailable = false
      return false
    }
  }

  function newRun(scene) {
    return {
      id: globalThis.crypto?.randomUUID?.() || String(Date.now()) + '-' + Math.random().toString(36).slice(2),
      entries: [...(scene.seed ? [{ kind: 'seed', ...scene.seed }] : []), { kind: 'assistant', node: scene.start }],
      attempts: {},

  function element(tag, className, text) {
    const created = document.createElement(tag)
    if (className) created.className = className
    if (text !== undefined) created.textContent = text

  }

      } else if (part.startsWith('**') && part.endsWith('**')) {
        const emphasized = rich('strong', part.slice(2, -2))

  function describe(problem, choice) {

  function reviewFor(problem, answers) {
    if (problem === 'variants') {
      const completed = ['v1', 'v2', 'v3'].filter((id) => answers[id]?.length)

      else if (!mainAssigned && action.kind !== 'link') {

      }

      onScroll()
    }
  }

  function onScroll() {
    $('jump').hidden = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 52
  }

  function finishReplay() {
    if (!pending) return
    const done = pending.entry
    pending = null
    delete done.stopped
    delete done.visible
    persist()
    render()
    announcement.textContent = '预设讲解已载入。'
  }

  function stepReplay() {
    if (!pending) return
    const count = current.nodes[pending.entry.node].blocks.length
    if (pending.visible >= count) {
      finishReplay()
      return
    }
    pending.visible += 1
    render()
    pending.entry.visible = pending.visible
    persist()
    pending.timer = setTimeout(stepReplay, 145)
  }

  function startReplay(entry, visible = 0) {
    if (reducedMotion.matches) {
      delete entry.stopped
      delete entry.visible
      persist()
      render()
      announcement.textContent = '预设讲解已载入。'
      goToStart(entry)
      return
    }
    pending = { entry, visible, timer: null }
    stepReplay()
    goToStart(entry)
  }

  function haltReplay() {
    if (!pending) return
    clearTimeout(pending.timer)
    pending.entry.stopped = true
    pending.entry.visible = pending.visible
    pending = null
    persist()
  }

  function continueReplay(entry) {
    if (latest() === entry && entry.stopped && !pending) startReplay(entry, entry.visible)
  }

  function transition(edge, { text, picture, label }) {
    if (!edge?.to || pending || latest()?.stopped) return
    const thisRun = run()
    const active = latest()
    if (label) active.selected = label
    if (text || picture) thisRun.entries.push({ kind: 'student', text, attachment: picture })
    if (edge.record) {
      const { problem, value, correct } = edge.record
      const attempts = thisRun.attempts[problem] ??= []
      attempts.push({ value, correct })
    }
    const entry = { kind: 'assistant', node: edge.to, stopped: true, visible: 0 }
    if (current.nodes[edge.to].blocks.some((block) => block.type === 'review')) {
      entry.reviewAttempts = structuredClone(thisRun.attempts)
    }
    thisRun.entries.push(entry)
    const durable = persist()
    setNotice(durable ? '' : '本窗口可继续体验，浏览器暂时无法保存进度。')
    announcement.textContent = ''
    startReplay(entry)
  }

  function commitAction(action, entry) {
    if (entry !== latest() || pending || entry.stopped) return
    if (action.kind === 'link') {
      switchScene(action.scene)
      return
    }
    if (action.kind === 'save') {
      const key = run().id + ':' + action.problem
      if (state.notebook[key]) return
      const record = { problem: action.problem, attempts: structuredClone(run().attempts[action.problem]) }
      state.notebook[key] = record
      const durable = persist()
      if (!durable) record.temporary = true
      render()
      setNotice(durable ? '已保存。可以从左侧「错题」打开这次的首答和订正。'
        : '已加入当前窗口的错题列表。浏览器暂时无法保存，刷新后无法恢复。')
      return
    }
    scroll.focus({ preventScroll: true })
    transition(action, action.kind === 'answer' ? { text: action.label, label: action.label } : {})
  }

  function setAttachment(id) {
    attachment = id
    const holder = $('draft-attachment')
    holder.hidden = !id
    holder.replaceChildren()
    if (id) {
      const chip = element('span', 'attachment-chip', data.assets[id].title)
      chip.append(button('移除', () => setAttachment(null), 'action'))
      holder.append(chip)
    }
    syncSend()
  }

  async function selectAttachment(file) {
    if (!file) return
    const sequence = ++fileSequence
    setAttachment(null)
    if (!globalThis.crypto?.subtle) {
      setNotice('当前浏览器无法核对题图。可以在左侧打开拍照示例。')
      return
    }
    const buffer = await crypto.subtle.digest('SHA-256', await file.arrayBuffer())
    if (sequence !== fileSequence) return
    const hash = [...new Uint8Array(buffer)].map((byte) => byte.toString(16).padStart(2, '0')).join('')
    const recognized = Object.keys(data.assets).find((id) => data.assets[id].sha256 === hash)
    if (!recognized) {
      setNotice('这个预览只支持随包的两张题图。可以换成示例题图，或直接打开拍照解题会话。')
      return
    }
    setNotice('已选中本地题图，可以发送。')
    setAttachment(recognized)
  }

  function submit() {
    if (pending) {
      haltReplay()
      render()
      return
    }
    if (latest()?.stopped) return
    const text = draft.value.trim()
    if (attachment) {
      const picture = attachment
      if (text && !['看题图', '请讲解这道题', '请分析题图'].includes(normalize(text))) {
        setNotice('题图已选中。可以直接发送题图，或输入「请讲解这道题」。')
        return
      }
      switchScene('photo')
      if (latest()?.stopped) {
        draft.value = text
        setAttachment(picture)
        setNotice('上次的题图讲解已暂停。继续查看或重置会话后，可以发送选中的题图。')
        return
      }
      const photoRun = run()
      if (photoRun.entries.length === 2 && photoRun.entries[0].kind === 'seed' && latest().node === 'photo-open') {
        photoRun.entries = []
      }
      draft.value = ''
      setAttachment(null)
      transition({ to: picture === 'unclear' ? 'confirm-image' : 'photo-upload' }, { text, picture })
      return
    }
    if (!text) return
    const edge = current.nodes[latest().node].inputs?.find((input) =>
      input.aliases.some((alias) => normalize(alias) === normalize(text)))
    if (!edge) {
      setNotice('这一句超出本场景的预设范围。可以换个问法，或用当前回复里的操作继续。')
      return
    }
    draft.value = ''
    transition(edge, { text })
  }

  for (const scene of data.scenes) {
    const item = button(scene.label, () => switchScene(scene.id), 'scenario-item')
    item.dataset.scene = scene.id
    item.title = scene.title
    $('scenes').append(item)
  }
  const product = { home: 'photo', practice: 'variants', error: 'error' }
  for (const item of document.querySelectorAll('[data-product-nav]')) {
    item.addEventListener('click', () => switchScene(product[item.dataset.productNav]))
  }
  $('sidebar-toggle').addEventListener('click', (event) => {
    const opened = document.body.classList.toggle('sidebar-open')
    event.currentTarget.setAttribute('aria-expanded', String(opened))
  })
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeNavigation() })
  window.addEventListener('hashchange', () => switchScene(location.hash.slice(1), false))
  $('restart').addEventListener('click', () => {
    haltReplay()
    fileSequence += 1
    state.runs[current.id] = newRun(current)
    draft.value = ''
    setAttachment(null)
    scroll.scrollTop = 0
    persist()
    render()
    setNotice('本示例已重开。之前保存的错题仍可在「错题」查看。')
  })
  scroll.addEventListener('scroll', onScroll, { passive: true })
  $('jump').addEventListener('click', () => { scroll.scrollTop = scroll.scrollHeight })
  $('attach').addEventListener('click', () => $('file').click())
  $('file').addEventListener('change', (event) => {
    const file = event.target.files[0]
    event.target.value = ''
    selectAttachment(file).catch(() => setNotice('这张图暂时无法读取。可以重新选择随包题图。'))
  })
  $('composer').addEventListener('submit', (event) => { event.preventDefault(); submit() })
  draft.addEventListener('input', syncSend)
  draft.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' || event.shiftKey || event.isComposing || event.keyCode === 229) return
    event.preventDefault()
    if (!pending) submit()
  })

  render()
  if (!storageAvailable) setNotice('浏览器未开放本地保存。当前窗口内可以继续体验。')
})()
</script></body>
</html>
